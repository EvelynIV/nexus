# OmegaConf-readable Nexus config driven by environment variables.
# Example:
#   export NEXUS_ASR_GRPC_ADDR=127.0.0.1:50051
#   export NEXUS_RESPONSES_BASE_URL=https://api.openai.com/v1
#   export NEXUS_RESPONSES_API_KEY=sk-...
#   export NEXUS_REALTIME_API_KEY=local-dev-key
#   export NEXUS_TTS_GRPC_ADDR=127.0.0.1:30036
#   export NEXUS_TTS_GRPC_REF_VOICE_DIR=/path/to/voices
#   poetry run nexus serve examples/configs/nexus.env.yaml
#
# If you want to reuse the current repo-level `.env`, you can also export:
#   NEXUS_RESPONSES_BASE_URL="$OPENAI_BASE_URL"
#   NEXUS_RESPONSES_API_KEY="$OPENAI_API_KEY"

asr_grpc_addr: ${oc.env:NEXUS_ASR_GRPC_ADDR,127.0.0.1:50051}

responses_base_url: ${oc.env:NEXUS_RESPONSES_BASE_URL,null}
responses_api_key: ${oc.env:NEXUS_RESPONSES_API_KEY,null}

tts_grpc_addr: ${oc.env:NEXUS_TTS_GRPC_ADDR,null}
tts_grpc_ref_voice_dir: ${oc.env:NEXUS_TTS_GRPC_REF_VOICE_DIR,null}
tts_grpc_language: ${oc.env:NEXUS_TTS_GRPC_LANGUAGE,auto}
tts_grpc_decoder_chunk_size: ${oc.env:NEXUS_TTS_GRPC_DECODER_CHUNK_SIZE,50}
tts_grpc_text_chunk_size: ${oc.env:NEXUS_TTS_GRPC_TEXT_CHUNK_SIZE,1}

asr_interim_results: ${oc.env:NEXUS_ASR_INTERIM_RESULTS,true}

realtime_api_key: ${oc.env:NEXUS_REALTIME_API_KEY,null}
realtime_client_secret_ttl_seconds: ${oc.env:NEXUS_REALTIME_CLIENT_SECRET_TTL_SECONDS,600}
realtime_session_max_seconds: ${oc.env:NEXUS_REALTIME_SESSION_MAX_SECONDS,3600}

asterisk_ingress_enabled: ${oc.env:NEXUS_ASTERISK_INGRESS_ENABLED,false}
asterisk_ari_url: ${oc.env:NEXUS_ASTERISK_ARI_URL,http://127.0.0.1:8088/ari}
asterisk_ari_user: ${oc.env:NEXUS_ASTERISK_ARI_USER,voicebot}
asterisk_ari_password: ${oc.env:NEXUS_ASTERISK_ARI_PASSWORD,12345678}
asterisk_stasis_app: ${oc.env:NEXUS_ASTERISK_STASIS_APP,nexus}
asterisk_external_host: ${oc.env:NEXUS_ASTERISK_EXTERNAL_HOST,127.0.0.1}
asterisk_rtp_port_start: ${oc.env:NEXUS_ASTERISK_RTP_PORT_START,4000}
asterisk_rtp_port_end: ${oc.env:NEXUS_ASTERISK_RTP_PORT_END,4099}
asterisk_codec: ${oc.env:NEXUS_ASTERISK_CODEC,ulaw}
asterisk_refer_endpoint_prefix: ${oc.env:NEXUS_ASTERISK_REFER_ENDPOINT_PREFIX,null}
realtime_webhook_url: ${oc.env:NEXUS_REALTIME_WEBHOOK_URL,null}
realtime_webhook_secret: ${oc.env:NEXUS_REALTIME_WEBHOOK_SECRET,null}
